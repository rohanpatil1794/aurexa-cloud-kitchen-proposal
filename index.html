<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#070d0e" />
    <!-- Double-brace tokens below are filled from src/config.ts by the html-meta plugin in vite.config.ts (dev and build). -->
    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:site_name" content="{{STUDIO_NAME}}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{SITE_TITLE}}" />
    <meta property="og:description" content="{{OG_DESCRIPTION}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{OG_IMAGE_ALT}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SITE_TITLE}}" />
    <meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Boot screen: dark from the very first paint (the app's cream body background must never show). -->
    <style>html{background:#070d0e}</style>
    <noscript><style>.splash{display:none!important}</style></noscript>
    <link rel="preload" as="image" href="/brand/mark.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/wordmark-dark.png" fetchpriority="high" />
  </head>
  <body>
    <div id="root">
      <!-- Static copy of ui/LoadingSplash.tsx (styled by .splash in src/index.css). React replaces it, and its own
           splash, portalled to <body>, appears in the same commit, so the hand-over is invisible. -->
      <div class="splash" role="status" aria-label="Loading the proposal">
        <div class="splash-logo">
          <img class="splash-mark" src="/brand/mark.png" width="600" height="615" alt="" decoding="sync" />
          <img class="splash-wordmark" src="/brand/wordmark-dark.png" width="654" height="187" alt="Aurexa Design Consultants" decoding="sync" />
        </div>
        <div class="splash-line" aria-hidden="true"></div>
      </div>
    </div>
    <noscript>
      <p style="position:fixed;inset:0;margin:0;display:grid;place-items:center;padding:24px;background:#070d0e;color:#f6e3c2;font:400 16px/1.5 system-ui,sans-serif;text-align:center">
        This proposal is an interactive 3D page and needs JavaScript to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
